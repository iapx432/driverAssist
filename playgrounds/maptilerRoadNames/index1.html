<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>MapLibre GL JS - Show Road Name on Hover</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  body { margin: 0; padding: 0; }
  #map { width: 100%; height: 100vh; }
  .tooltip {
    position: absolute;
    background: rgba(0, 0, 0, 0.75);
    color: white;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    pointer-events: none;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="tooltip" class="tooltip" style="display:none;"></div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script>
  // Create the map
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://demotiles.maplibre.org/style.json', // Must contain road layers with 'name'
    center: [-0.1276, 51.5072], // London
    zoom: 14
  });

  const tooltip = document.getElementById('tooltip');

  map.on('load', () => {
    // Listen for mouse movement
    map.on('mousemove', (e) => {
      const features = map.queryRenderedFeatures(e.point);

      if (features.length > 0 && features[0].properties.name) {
        tooltip.style.display = 'block';
        tooltip.textContent = features[0].properties.name;
        tooltip.style.left = (e.point.x + 10) + 'px';
        tooltip.style.top = (e.point.y + 10) + 'px';
      } else {
        tooltip.style.display = 'none';
      }
    });

    // Hide tooltip when mouse leaves map
    map.on('mouseleave', () => {
      tooltip.style.display = 'none';
    });
  });
</script>
</body>
</html>
