<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Model Playground</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    />

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Consolas, monospace;
            background: #1e1e1e;
            color: white;
        }

        #header {
            height: 40px;
            line-height: 40px;
            padding-left: 12px;
            background: #2d2d2d;
            border-bottom: 1px solid #444;
            font-weight: bold;
        }

        #map {
            height: calc(100vh - 40px);
        }

        #content {
            padding: 16px;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
        }

        pre {
            margin-top: 20px;
            padding: 10px;
            background: #252526;
            border: 1px solid #444;
            overflow: auto;
        }
    </style>
</head>

<body>
    <div id="header">
        Spatial Model Playground
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.vectorgrid/dist/Leaflet.VectorGrid.bundled.js"></script>
    <script type="module" src="./main.js"></script>

</body>

</html>
